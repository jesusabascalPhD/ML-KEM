[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlkem"
version = "0.1.0"
description = "Pure-Python implementation of ML-KEM (NIST FIPS 203)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jesús Abascal", email = "jesusabascal@hotmail.com" }]
requires-python = ">=3.10"
keywords = ["post-quantum", "cryptography", "ml-kem", "kyber", "fips-203"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/jesusabascalPhD/ML-KEM"
Repository = "https://github.com/jesusabascalPhD/ML-KEM"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=4"]

[tool.setuptools.packages.find]
include = ["mlkem_pkg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["mlkem_pkg"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
